[project]
name = "multidim_screening_plain"
version = "0.0.4"
description = "multidimensional screening without Numba"
authors = [{ name = "Bernard Salanie", email = "fbsalanie@columbia.edu" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4",
    "scipy>=1.18",
    "pandas>=3.1",
    "matplotlib>=3.11",
    "altair>=6.3",
    "bs_python_utils>=1.1.3",
    "python-dotenv>=1.2",
    "rich>=15.0",
    "click>=8.5",
]

[project.urls]
Repository = "https://github.com/bsalanie/multidim-screening-plain"
Documentation = "https://bsalanie.github.io/multidim-screening-plain/"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "mypy>=2.4",
    "pre-commit>=4.7",
    "icecream>=2.2",
    "code2flow>=2.5",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.8",
    "mkdocstrings[python]>=1.0",
]

[tool.uv]
default-groups = ["dev", "docs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["multidim_screening_plain"]

[tool.black]
line-length = 88
target-version = ['py313']
preview = true

[tool.mypy]
files = ["multidim_screening_plain"]
disallow_untyped_defs = "True"
disallow_any_unimported = "True"
no_implicit_optional = "True"
check_untyped_defs = "True"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"

[tool.ruff]
target-version = "py313"
line-length = 88
fix = true
extend-exclude = ["obsolete"]
lint.select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
lint.ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]


