[project]
name = "multidim_screening_plain"
version = "0.0.4"
description = "multidimensional screening without Numba"
authors = [{ name = "Bernard Salanie", email = "fbsalanie@columbia.edu" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2",
    "scipy==1.10.*",
    "pandas>=2.2.0,<3",
    "matplotlib>=3.7.1",
    "altair>=5.0",
    "bs_python_utils>=0.6.4",
    "python-dotenv>=1.0.1,<2",
    "rich>=13.7.1,<14",
    "click>=8.1.7,<9",
]

[project.urls]
Repository = "https://github.com/bsalanie/multidim-screening-plain"
Documentation = "https://bsalanie.github.io/multidim-screening-plain/"

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "mypy>=0.981",
    "pre-commit>=2.20.0",
    "icecream>=2.1.3",
    "code2flow>=0.0.0",
]
docs = [
    "mkdocs>=1.4.2",
    "mkdocs-material>=8.5.10",
    "mkdocstrings[python]>=0.21.0",
]

[tool.uv]
default-groups = ["dev", "docs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["multidim_screening_plain"]

[tool.black]
line-length = 88
target-version = ['py310']
preview = true

[tool.mypy]
files = ["multidim_screening_plain"]
disallow_untyped_defs = "True"
disallow_any_unimported = "True"
no_implicit_optional = "True"
check_untyped_defs = "True"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"

[tool.ruff]
target-version = "py310"
line-length = 88
fix = true
lint.select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
lint.ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]


